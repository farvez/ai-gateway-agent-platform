line-length = 100
target-version = "py310"

[lint]
# E/W: pycodestyle, F: pyflakes (unused imports, undefined names),
# I: import sorting, UP: modern Python syntax, B: common bug patterns
select = ["E", "W", "F", "I", "UP", "B"]

[lint.flake8-bugbear]
# FastAPI's dependency injection uses Depends()/Query() as argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
